[project]
name = "instapromo"
version = "0.1.0"
description = "앱/웹페이지 설명으로 Instagram 홍보 피드를 생성하고 업로드하는 도구"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "google-genai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
instapromo = "instapromo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instapromo = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
